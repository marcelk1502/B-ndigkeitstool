<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bündigkeiten">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e293b'/><rect x='10' y='10' width='80' height='80' rx='14' fill='%230f172a' stroke='%23f59e0b' stroke-width='4'/><text y='.9em' x='22' font-size='68' fill='%23f59e0b'>⇕</text></svg>">
<title>Bündigkeiten - Aufzugservice</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    
    --bg-base: #0b0f19;
    --card-surface: linear-gradient(160deg, #1e293b 0%, #111827 100%);
    --card-border: #334155;
    --border-subtle: #1e293b;
    --text: #f8fafc;
    --text-muted: #94a3b8;

    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.3);
    --accent-bg: rgba(245, 158, 11, 0.12);

    --ok: #10b981;
    --ok-bg: rgba(16, 185, 129, 0.15);
    --ok-border: #059669;
    --ok-text: #34d399;

    --bad: #ef4444;
    --bad-bg: rgba(239, 68, 68, 0.18);
    --bad-border: #dc2626;
    --bad-text: #f87171;

    --shadow-raised: 
      0 4px 8px -1px rgba(0, 0, 0, 0.5), 
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    --shadow-sunken: 
      inset 0 2px 5px rgba(0, 0, 0, 0.7),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: env(safe-area-inset-top, 10px) 8px calc(env(safe-area-inset-bottom, 16px) + 24px);
    background: var(--bg-base);
    min-height: 100vh;
    color: var(--text);
    font-family: var(--font);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  .layout-wrap {
    display: flex;
    justify-content: center;
    gap: 8px;
    max-width: 600px;
    margin: 0 auto;
    position: relative;
  }

  .app-container { flex: 1; min-width: 0; }

  /* Schacht-Säule */
  .shaft-panel {
    width: 32px;
    flex: none;
    position: sticky;
    top: calc(env(safe-area-inset-top, 10px) + 64px);
    align-self: flex-start;
    background: #0f172a;
    border: 1.5px solid var(--card-border);
    border-radius: var(--radius-md);
    padding: 6px 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    box-shadow: var(--shadow-raised);
    z-index: 10;
  }

  .shaft-title {
    font-size: 0.55rem;
    font-weight: 900;
    color: var(--accent);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .shaft-node {
    width: 24px;
    height: 18px;
    border-radius: 4px;
    background: #1e293b;
    border: 1px solid #334155;
    font-size: 0.65rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.5);
    transition: transform 0.1s;
  }

  .shaft-node:active { transform: scale(0.88); }
  .shaft-node.ok { background: #065f46; border-color: #10b981; color: #fff; }
  .shaft-node.bad { background: #7f1d1d; border-color: #ef4444; color: #fff; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
  .shaft-node.partial { background: #1e3a8a; border-color: #3b82f6; color: #fff; }

  /* Header */
  header.top-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(11, 15, 25, 0.88);
    padding-top: 6px;
    padding-bottom: 8px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .nav-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    margin-bottom: 6px;
  }

  .title-group h1 {
    font-size: 1.65rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin: 0;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }

  .badges { display: flex; gap: 6px; }

  .badge {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    background: #1e293b;
    border: 1px solid #334155;
    color: var(--text-muted);
    box-shadow: var(--shadow-raised);
    text-transform: uppercase;
  }

  .badge.alert {
    background: var(--bad-bg);
    color: var(--bad-text);
    border-color: var(--bad-border);
  }

  .progress-wrap {
    height: 5px;
    background: #1e293b;
    border-radius: 99px;
    overflow: hidden;
    box-shadow: var(--shadow-sunken);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #eab308);
    box-shadow: 0 0 10px var(--accent-glow);
    transition: width 0.25s ease;
  }

  /* Einstellungen */
  details.settings-card {
    background: var(--card-surface);
    border: 1.5px solid var(--card-border);
    border-radius: var(--radius-lg);
    margin: 8px 0 12px;
    box-shadow: var(--shadow-raised);
    overflow: hidden;
  }

  details.settings-card summary {
    list-style: none;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 800;
    font-size: 0.85rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  details.settings-card summary::-webkit-details-marker { display: none; }
  details.settings-card summary .icon-arrow {
    transition: transform 0.2s;
    fill: currentColor;
  }
  details.settings-card[open] summary .icon-arrow { transform: rotate(180deg); }

  .settings-content {
    padding: 6px 14px 14px;
    border-top: 1px solid var(--card-border);
    background: rgba(0,0,0,0.3);
  }

  .settings-grid {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr 1.2fr;
    gap: 8px;
    margin-top: 6px;
  }

  .setting-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.7rem;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .setting-item input {
    height: 38px;
    width: 100%;
    border: 1.5px solid var(--card-border);
    border-radius: var(--radius-sm);
    background: #0f172a;
    color: #fff;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 900;
    text-align: center;
    box-shadow: var(--shadow-sunken);
  }

  .presets-wrap {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .presets-title {
    font-size: 0.68rem;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .presets-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .btn-preset {
    height: 30px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    background: #1e293b;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: var(--shadow-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
  }

  .btn-preset:active { transform: translateY(1px); }
  .btn-preset.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
  }

  .action-row { display: flex; gap: 8px; margin-top: 12px; }

  .btn {
    flex: 1;
    height: 40px;
    border-radius: var(--radius-md);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.1s;
    border: 1.5px solid var(--card-border);
    background: #1e293b;
    color: #fff;
    box-shadow: var(--shadow-raised);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .btn:active {
    transform: translateY(2px);
    box-shadow: var(--shadow-sunken);
  }

  .btn.primary {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    border-color: #b45309;
    color: #000;
    box-shadow: 0 3px 10px var(--accent-glow);
  }

  .btn.danger {
    background: var(--bad-bg);
    border-color: var(--bad-border);
    color: var(--bad-text);
  }
  .btn.danger.armed {
    background: #dc2626;
    color: #fff;
    border-color: #991b1b;
  }

  /* Spaltenköpfe */
  .grid-header {
    position: sticky;
    top: 76px;
    z-index: 15;
    display: grid;
    grid-template-columns: 44px 1fr 1fr;
    gap: 6px;
    padding: 4px 0 8px;
  }

  .header-pill {
    background: #1e293b;
    border: 1.5px solid var(--card-border);
    border-radius: var(--radius-sm);
    padding: 7px 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 900;
    color: #fff;
    box-shadow: var(--shadow-raised);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .header-pill.up { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
  .header-pill.down { color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); }

  /* Etagenliste */
  .floor-list { display: flex; flex-direction: column; gap: 8px; }

  .floor-card {
    background: var(--card-surface);
    border: 1.5px solid var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-raised);
    display: grid;
    grid-template-columns: 44px 1fr 1fr;
    overflow: hidden;
    scroll-margin-top: 125px;
  }

  .floor-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    font-weight: 900;
    background: #0f172a;
    border-right: 1.5px solid var(--card-border);
    color: #fff;
    user-select: none;
    box-shadow: inset -2px 0 5px rgba(0,0,0,0.5);
  }

  .cell-card {
    margin: 0;
    padding: 8px 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    background: transparent;
    transition: background 0.2s;
  }

  .cell-card.dir-down { border-left: 1.5px dashed #334155; }
  .cell-card.ok { background: var(--ok-bg); }
  .cell-card.bad { background: var(--bad-bg); }

  .cell-card.na {
    background: rgba(15, 23, 42, 0.6);
    color: #475569;
    font-size: 0.7rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .cell-main { display: flex; align-items: center; gap: 8px; }

  .input-wrapper { flex: 1; min-width: 0; }

  .val-input {
    width: 100%;
    height: 42px;
    border: 1.5px solid var(--card-border);
    border-radius: var(--radius-sm);
    background: #090d16;
    color: #fff;
    font: inherit;
    font-size: 1.25rem;
    font-weight: 900;
    text-align: center;
    padding: 0;
    outline: none;
    box-shadow: var(--shadow-sunken);
  }

  .val-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow), var(--shadow-sunken);
  }

  /* Pegelanzeige */
  .gauge-container {
    flex: none;
    width: 12px;
    height: 42px;
    background: #090d16;
    border: 1px solid #1e293b;
    border-radius: 99px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow-sunken);
  }

  .gauge-tolerance {
    position: absolute;
    left: 0; right: 0;
    background: #10b981;
    opacity: 0.45;
  }

  .gauge-center-line {
    position: absolute;
    left: 0; right: 0;
    top: calc(50% - 0.5px);
    height: 1.5px;
    background: #f8fafc;
  }

  .gauge-pointer {
    position: absolute;
    left: 1px;
    width: 10px;
    height: 6px;
    border-radius: 2px;
    background: #fff;
    top: calc(50% - 3px);
    display: none;
    transition: top 0.15s ease-out;
  }

  .cell-card.ok .gauge-pointer { display: block; background: #10b981; box-shadow: 0 0 6px #10b981; }
  .cell-card.bad .gauge-pointer { display: block; background: #ef4444; box-shadow: 0 0 6px #ef4444; }

  .status-text {
    font-size: 0.7rem;
    font-weight: 800;
    margin-top: 3px;
    text-align: center;
    color: var(--text-muted);
    min-height: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell-card.ok .status-text { color: var(--ok-text); }
  .cell-card.bad .status-text { color: var(--bad-text); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .modal-card {
    background: #111827;
    border: 1.5px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 30px rgba(0,0,0,0.8);
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    padding: 12px 16px;
    border-bottom: 1.5px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f172a;
  }

  .modal-header h2 {
    font-size: 1.1rem;
    font-weight: 900;
    margin: 0;
    color: #fff;
    text-transform: uppercase;
  }

  .modal-close {
    background: transparent;
    border: none;
    font-size: 1.4rem;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 6px;
  }

  .modal-body { padding: 12px 16px; overflow-y: auto; }

  .report-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
    background: #0f172a;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--card-border);
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .report-status-badge {
    grid-column: span 2;
    padding: 8px;
    border-radius: var(--radius-sm);
    font-weight: 900;
    text-align: center;
    font-size: 0.82rem;
  }

  .report-status-badge.ok {
    background: var(--ok-bg);
    color: var(--ok-text);
    border: 1px solid var(--ok-border);
  }
  .report-status-badge.bad {
    background: var(--bad-bg);
    color: var(--bad-text);
    border: 1px solid var(--bad-border);
  }

  .report-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    text-align: center;
  }

  .report-table th {
    background: #0f172a;
    padding: 7px;
    font-size: 0.72rem;
    font-weight: 900;
    color: var(--text-muted);
    border-bottom: 2px solid var(--card-border);
    text-transform: uppercase;
  }

  .report-table td {
    padding: 7px 4px;
    border-bottom: 1px solid #1e293b;
    font-weight: 800;
    font-size: 0.85rem;
  }

  .report-val {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.8rem;
  }
  .report-val.ok { color: var(--ok-text); background: var(--ok-bg); }
  .report-val.bad { color: var(--bad-text); background: var(--bad-bg); font-weight: 900; }
  .report-val.na { color: #475569; }

  .diff-tag {
    font-size: 0.75rem;
    font-weight: 900;
    color: var(--accent);
  }

  .modal-actions {
    padding: 12px 16px;
    border-top: 1.5px solid var(--card-border);
    background: #0f172a;
    display: flex;
    gap: 8px;
  }
</style>
</head>
<body>

<div class="layout-wrap">
  <div class="app-container">
    <!-- Header -->
    <header class="top-bar">
      <div class="nav-header">
        <div class="title-group">
          <h1>Bündigkeiten</h1>
        </div>
        <div class="badges">
          <span class="badge alert" id="chipBad" hidden>0 Abweichungen</span>
          <span class="badge" id="chipCount">0 / 0</span>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" id="progressBar"></div>
      </div>
    </header>

    <!-- Einstellungen -->
    <details class="settings-card" id="settingsDetails">
      <summary>
        <span>⚙️ Parameter & Richtlinien</span>
        <svg class="icon-arrow" width="16" height="16" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </summary>
      <div class="settings-content">
        <div class="settings-grid">
          <label class="setting-item">
            Etagen
            <input id="floorCount" type="number" min="1" max="50" inputmode="numeric" value="5">
          </label>
          <label class="setting-item">
            Start
            <input id="startFloor" type="number" inputmode="numeric" value="0">
          </label>
          <label class="setting-item">
            Toleranz ± mm
            <input id="tolerance" type="number" min="0" step="1" inputmode="numeric" value="10">
          </label>
        </div>

        <div class="presets-wrap">
          <div class="presets-title">Richtwerte / Norm-Toleranz</div>
          <div class="presets-grid">
            <button type="button" class="btn-preset" data-tol="3" title="Klinik / Präzision">± 3 mm</button>
            <button type="button" class="btn-preset" data-tol="5" title="Seil / High-Speed">± 5 mm</button>
            <button type="button" class="btn-preset active" data-tol="10" title="DIN EN 81-20 Standard">± 10 mm</button>
            <button type="button" class="btn-preset" data-tol="20" title="Nachregulierung / Güter">± 20 mm</button>
          </div>
        </div>

        <div class="action-row">
          <button type="button" class="btn primary" id="openReportBtn">📊 Protokoll</button>
          <button type="button" class="btn danger" id="resetBtn">Werte leeren</button>
        </div>
      </div>
    </details>

    <!-- Spaltenköpfe -->
    <div class="grid-header">
      <div class="header-pill">Et.</div>
      <div class="header-pill up">▲ Aufwärts</div>
      <div class="header-pill down">▼ Abwärts</div>
    </div>

    <!-- Etagenliste -->
    <main class="floor-list" id="listContainer"></main>
  </div>

  <!-- Schachtsäule -->
  <aside class="shaft-panel" id="shaftPanel" aria-label="Schacht-Übersicht">
    <div class="shaft-title">Et.</div>
    <div id="shaftNodes" style="display:flex; flex-direction:column; gap:4px; width:100%; align-items:center;"></div>
  </aside>
</div>

<!-- Modal Pop-up Protokoll -->
<div class="modal-overlay" id="reportModal" onclick="closeModalOnOutsideClick(event)">
  <div class="modal-card">
    <div class="modal-header">
      <h2>📋 Messprotokoll</h2>
      <button type="button" class="modal-close" onclick="closeReportModal()">&times;</button>
    </div>
    <div class="modal-body" id="reportBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="copyReportText()">📋 Kopieren</button>
      <button type="button" class="btn primary" onclick="window.print()">🖨️ PDF / Drucken</button>
    </div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'buendigkeit-elev-v2';
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll([self.location.href])));
        self.skipWaiting();
      });
      self.addEventListener('fetch', e => {
        e.respondWith(caches.match(e.request).then(res => res || fetch(e.request).catch(() => caches.match(self.location.href))));
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }

  const STORAGE_KEY = 'buendigkeit-elev-v2';
  let state = {
    floorCount: 5,
    startFloor: 0,
    tolerance: 10,
    values: {}
  };

  const $ = id => document.getElementById(id);

  function loadState() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) state = Object.assign(state, JSON.parse(data));
    } catch (e) {}
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function parseVal(v) {
    if (v === '' || v == null) return null;
    const n = parseInt(v, 10);
    return isNaN(n) ? null : n;
  }

  function readSettings() {
    state.floorCount = Math.min(50, Math.max(1, parseInt($('floorCount').value, 10) || 1));
    state.startFloor = parseInt($('startFloor').value, 10) || 0;
    const t = parseInt($('tolerance').value, 10);
    state.tolerance = isNaN(t) ? 10 : Math.abs(t);
    updatePresetButtons();
  }

  function updatePresetButtons() {
    document.querySelectorAll('.btn-preset').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.tol, 10) === state.tolerance);
    });
  }

  function renderCell(floor, dir) {
    const isBottom = floor === state.startFloor;
    const isTop = floor === state.startFloor + state.floorCount - 1;
    const dirClass = dir === 'down' ? 'dir-down' : 'dir-up';

    if ((dir === 'up' && isBottom) || (dir === 'down' && isTop)) {
      return `<div class="cell-card ${dirClass} na">Endhalt</div>`;
    }

    const key = `${floor}:${dir}`;
    const val = state.values[key] ?? '';

    return `
      <form class="cell-card ${dirClass}" data-key="${key}" data-floor="${floor}" data-dir="${dir}" onsubmit="event.preventDefault(); handleMobileNext(this);">
        <div class="cell-main">
          <div class="input-wrapper">
            <input type="text" class="val-input" inputmode="text" placeholder="0" value="${val}" enterkeyhint="next">
          </div>
          <div class="gauge-container" title="Doppelklick für 0 mm">
            <div class="gauge-tolerance"></div>
            <div class="gauge-center-line"></div>
            <div class="gauge-pointer"></div>
          </div>
        </div>
        <div class="status-text"></div>
      </form>
    `;
  }

  function renderShaft() {
    const shaft = $('shaftNodes');
    let html = '';
    for (let f = state.startFloor + state.floorCount - 1; f >= state.startFloor; f--) {
      html += `<div class="shaft-node" id="shaft-node-${f}" onclick="scrollToFloor(${f})">${f}</div>`;
    }
    shaft.innerHTML = html;
  }

  window.scrollToFloor = function(floor) {
    const el = document.getElementById(`floor-card-${floor}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  function renderList() {
    readSettings();
    const container = $('listContainer');
    let html = '';

    for (let f = state.startFloor + state.floorCount - 1; f >= state.startFloor; f--) {
      html += `
        <div class="floor-card" id="floor-card-${f}">
          <div class="floor-label">${f}</div>
          ${renderCell(f, 'up')}
          ${renderCell(f, 'down')}
        </div>
      `;
    }

    container.innerHTML = html;
    renderShaft();
    container.querySelectorAll('.cell-card[data-key]').forEach(applyCellStyles);
    updateMetrics();
    saveState();
  }

  function applyCellStyles(card) {
    const input = card.querySelector('.val-input');
    if (!input) return;
    const n = parseVal(input.value);
    const status = card.querySelector('.status-text');
    const pointer = card.querySelector('.gauge-pointer');
    const tolBand = card.querySelector('.gauge-tolerance');

    card.classList.remove('ok', 'bad');

    if (n === null) {
      status.textContent = '';
      return;
    }

    const isExceeded = Math.abs(n) > state.tolerance;
    card.classList.add(isExceeded ? 'bad' : 'ok');

    if (n === 0) {
      status.textContent = 'bündig (0 mm)';
    } else if (n > 0) {
      status.textContent = `+${n} mm zu hoch`;
    } else {
      status.textContent = `${n} mm zu tief`;
    }

    const tolerance = Math.max(state.tolerance, 1);
    const range = Math.max(14, tolerance * 1.5);
    const tolPercent = Math.min(50, (tolerance / range) * 50);

    tolBand.style.top = (50 - tolPercent) + '%';
    tolBand.style.height = (tolPercent * 2) + '%';

    const clamped = Math.max(-range, Math.min(range, n));
    const normalized = (clamped / range);
    const topPct = 50 - (normalized * 50);
    pointer.style.top = `calc(${topPct}% - 3px)`;
  }

  function updateMetrics() {
    const cells = document.querySelectorAll('.cell-card[data-key]');
    let filled = 0;
    let bad = 0;

    cells.forEach(c => {
      if (c.classList.contains('bad')) { bad++; filled++; }
      else if (c.classList.contains('ok')) { filled++; }
    });

    const total = cells.length;
    $('chipCount').textContent = `${filled} / ${total} gemessen`;
    
    const chipBad = $('chipBad');
    if (bad > 0) {
      chipBad.hidden = false;
      chipBad.textContent = `${bad} Abweichungen`;
    } else {
      chipBad.hidden = true;
    }

    const pct = total ? (filled / total * 100) : 0;
    $('progressBar').style.width = pct + '%';

    for (let f = state.startFloor + state.floorCount - 1; f >= state.startFloor; f--) {
      const node = $(`shaft-node-${f}`);
      if (!node) continue;
      const up = parseVal(state.values[`${f}:up`]);
      const dn = parseVal(state.values[`${f}:down`]);
      
      const isTop = f === state.startFloor + state.floorCount - 1;
      const isBottom = f === state.startFloor;
      
      const upBad = up !== null && Math.abs(up) > state.tolerance;
      const dnBad = dn !== null && Math.abs(dn) > state.tolerance;

      node.classList.remove('ok', 'bad', 'partial');

      if (upBad || dnBad) {
        node.classList.add('bad');
      } else {
        const upComplete = isBottom || up !== null;
        const dnComplete = isTop || dn !== null;
        if (upComplete && dnComplete) {
          node.classList.add('ok');
        } else if ((up !== null && !isBottom) || (dn !== null && !isTop)) {
          node.classList.add('partial');
        }
      }
    }
  }

  const container = $('listContainer');

  container.addEventListener('dblclick', e => {
    const card = e.target.closest('.cell-card');
    if (!card || card.classList.contains('na')) return;
    const input = card.querySelector('.val-input');
    if (input) {
      input.value = '0';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      advanceDirectional(card);
    }
  });

  window.handleMobileNext = function(card) { advanceDirectional(card); };

  container.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const card = e.target.closest('.cell-card');
      if (card) advanceDirectional(card);
    }
  });

  function advanceDirectional(currentCard) {
    const floor = parseInt(currentCard.dataset.floor, 10);
    const dir = currentCard.dataset.dir;
    let targetCard = null;

    if (dir === 'up') {
      const nextFloor = floor + 1;
      targetCard = container.querySelector(`.cell-card[data-key="${nextFloor}:up"]`);
    } else if (dir === 'down') {
      const nextFloor = floor - 1;
      targetCard = container.querySelector(`.cell-card[data-key="${nextFloor}:down"]`);
    }

    if (targetCard) {
      const nextInput = targetCard.querySelector('.val-input');
      if (nextInput) {
        setTimeout(() => {
          nextInput.focus();
          nextInput.select();
          targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 50);
      }
    } else {
      const currentInput = currentCard.querySelector('.val-input');
      if (currentInput) currentInput.blur();
    }
  }

  container.addEventListener('input', e => {
    const input = e.target;
    if (!input.classList.contains('val-input')) return;

    let val = input.value.trim();
    // Vorzeichenerkennung für '+' und '-'
    let prefix = '';
    if (val.startsWith('-')) {
      prefix = '-';
    } else if (val.startsWith('+')) {
      prefix = '+';
    }

    val = val.replace(/[^0-9]/g, '');
    input.value = prefix + val;

    const card = input.closest('.cell-card');
    const key = card.dataset.key;

    if (input.value === '' || input.value === '-' || input.value === '+') {
      delete state.values[key];
    } else {
      state.values[key] = input.value;
    }

    applyCellStyles(card);
    updateMetrics();
    saveState();
  });

  document.querySelectorAll('.btn-preset').forEach(btn => {
    btn.addEventListener('click', () => {
      $('tolerance').value = btn.dataset.tol;
      renderList();
    });
  });

  ['floorCount', 'startFloor', 'tolerance'].forEach(id => {
    $(id).addEventListener('input', renderList);
  });

  let armTimer = null;
  $('resetBtn').addEventListener('click', function () {
    if (!this.classList.contains('armed')) {
      this.classList.add('armed');
      this.textContent = 'Wirklich leeren?';
      armTimer = setTimeout(() => {
        this.classList.remove('armed');
        this.textContent = 'Werte leeren';
      }, 3500);
      return;
    }
    clearTimeout(armTimer);
    this.classList.remove('armed');
    this.textContent = 'Werte leeren';
    state.values = {};
    renderList();
  });

  const modal = $('reportModal');

  $('openReportBtn').addEventListener('click', () => {
    buildReportHtml();
    modal.classList.add('active');
  });

  window.closeReportModal = function() { modal.classList.remove('active'); };
  window.closeModalOnOutsideClick = function(e) { if (e.target === modal) closeReportModal(); };

  function buildReportHtml() {
    const body = $('reportBody');
    const now = new Date();
    const dateStr = now.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

    let badCount = 0;
    let measuredCount = 0;
    let totalCells = 0;
    let tableRows = '';

    for (let f = state.startFloor + state.floorCount - 1; f >= state.startFloor; f--) {
      const isTop = f === state.startFloor + state.floorCount - 1;
      const isBottom = f === state.startFloor;

      const upVal = parseVal(state.values[`${f}:up`]);
      const dnVal = parseVal(state.values[`${f}:down`]);

      let upHtml = '';
      if (isBottom) {
        upHtml = '<span class="report-val na">—</span>';
      } else {
        totalCells++;
        if (upVal !== null) {
          measuredCount++;
          const bad = Math.abs(upVal) > state.tolerance;
          if (bad) badCount++;
          upHtml = `<span class="report-val ${bad ? 'bad' : 'ok'}">${upVal > 0 ? '+' : ''}${upVal} mm</span>`;
        } else {
          upHtml = '<span class="report-val na">offen</span>';
        }
      }

      let dnHtml = '';
      if (isTop) {
        dnHtml = '<span class="report-val na">—</span>';
      } else {
        totalCells++;
        if (dnVal !== null) {
          measuredCount++;
          const bad = Math.abs(dnVal) > state.tolerance;
          if (bad) badCount++;
          dnHtml = `<span class="report-val ${bad ? 'bad' : 'ok'}">${dnVal > 0 ? '+' : ''}${dnVal} mm</span>`;
        } else {
          dnHtml = '<span class="report-val na">offen</span>';
        }
      }

      let diffHtml = '<span class="report-val na">—</span>';
      if (upVal !== null && dnVal !== null) {
        const diff = Math.abs(upVal - dnVal);
        diffHtml = `<span class="diff-tag">Δ ${diff} mm</span>`;
      }

      tableRows += `
        <tr>
          <td><strong>${f}</strong></td>
          <td>${upHtml}</td>
          <td>${dnHtml}</td>
          <td>${diffHtml}</td>
        </tr>
      `;
    }

    const normLabel = state.tolerance === 10 ? ' (gemäß DIN EN 81-20)' : '';
    const statusText = badCount > 0 
      ? `⚠️ ${badCount} Mangel: Toleranzgrenze überschritten`
      : (measuredCount === totalCells ? `✓ Bestanden: Alle Haltepunkte im Toleranzbereich${normLabel}` : `ℹ️ ${measuredCount} von ${totalCells} Messwerten erfasst`);

    body.innerHTML = `
      <div class="report-meta">
        <div>Datum: <strong>${dateStr} ${timeStr}</strong></div>
        <div>Toleranz: <strong>±${state.tolerance} mm</strong></div>
        <div class="report-status-badge ${badCount > 0 ? 'bad' : 'ok'}">
          ${statusText}
        </div>
      </div>
      <table class="report-table">
        <thead>
          <tr>
            <th style="width: 44px;">Et.</th>
            <th>▲ Auf</th>
            <th>▼ Ab</th>
            <th>Δ Diff</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    `;
  }

  window.copyReportText = async function() {
    let report = `BÜNDIGKEITSMESSUNG PROTOKOLL\n`;
    report += `Datum: ${new Date().toLocaleDateString('de-DE')} | Grenz-Toleranz: ±${state.tolerance} mm\n`;
    report += `------------------------------------\n`;
    for (let f = state.startFloor + state.floorCount - 1; f >= state.startFloor; f--) {
      const up = state.values[`${f}:up`] !== undefined ? `${state.values[`${f}:up`]} mm` : (f === state.startFloor ? '—' : 'offen');
      const dn = state.values[`${f}:down`] !== undefined ? `${state.values[`${f}:down`]} mm` : (f === state.startFloor + state.floorCount - 1 ? '—' : 'offen');
      report += `Etage ${f.toString().padStart(2, ' ')} | ▲ Auf: ${up.padEnd(8, ' ')} | ▼ Ab: ${dn}\n`;
    }

    try {
      await navigator.clipboard.writeText(report);
      alert('Protokoll in die Zwischenablage kopiert!');
    } catch(err) {
      alert(report);
    }
  };

  loadState();
  $('floorCount').value = state.floorCount;
  $('startFloor').value = state.startFloor;
  $('tolerance').value = state.tolerance;
  renderList();
</script>
</body>
</html>
