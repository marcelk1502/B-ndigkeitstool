<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bündigkeits-Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 10%, #2f3542, #111317);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 12px;
    }

    /* Aufzugstableau Gehäuse (gebürsteter Edelstahl) */
    .tableau {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(135deg, #4b525d 0%, #2e3440 25%, #4b525d 50%, #262a33 75%, #3b4250 100%);
      border: 2px solid #5a6373;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.35),
        inset 0 -2px 4px rgba(0, 0, 0, 0.6),
        0 14px 28px rgba(0, 0, 0, 0.6),
        0 0 0 1px #1a1d24;
      position: relative;
    }

    /* Schrauben in den Ecken */
    .screw {
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #8a94a6, #2d323b);
      border-radius: 50%;
      box-shadow: inset 0 1px 1px #fff, 0 1px 2px #000;
    }
    .screw::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 1px;
      width: 8px;
      height: 1.5px;
      background: #111;
    }
    .s-tl { top: 10px; left: 10px; }
    .s-tr { top: 10px; right: 10px; }
    .s-bl { bottom: 10px; left: 10px; }
    .s-br { bottom: 10px; right: 10px; }

    .nav-back {
      display: inline-block;
      color: #79b8ff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    /* Punktmatrix / Digital-Display oben */
    .display-bezel {
      background: #08090b;
      border: 2px solid #23272f;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9);
    }
    .display-title {
      font-family: "Courier New", monospace;
      font-size: 0.95rem;
      color: #38bdf8;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    .dot-matrix {
      font-family: "Courier New", monospace;
      font-size: 1.2rem;
      font-weight: bold;
      color: #f59e0b;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
    }

    /* Layout-Split: Links Eingabe / Rechts Schacht-Animation */
    .main-view {
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .field label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .field input, .field select {
      width: 100%;
      background: #14171d;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      padding: 8px 10px;
      font-size: 0.95rem;
      outline: none;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }
    .field input:focus, .field select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px #38bdf8;
    }

    /* Schachtdarstellung rechts */
    .shaft-frame {
      background: #0d0f12;
      border: 2px solid #334155;
      border-radius: 8px;
      position: relative;
      height: 230px;
      overflow: hidden;
      box-shadow: inset 0 0 10px #000;
    }
    /* Führungsschienen */
    .guide-rail {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(90deg, #64748b, #334155);
    }
    .rail-left { left: 8px; }
    .rail-right { right: 8px; }

    /* Schwellen-Linie (Referenz Etage) */
    .landing-sill {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: #ef4444;
      z-index: 5;
      box-shadow: 0 0 4px #ef4444;
    }
    .sill-label {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-100%);
      font-size: 0.6rem;
      color: #ef4444;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Animierte Kabine */
    .car-box {
      position: absolute;
      left: 18px;
      right: 18px;
      height: 80px;
      top: calc(50% - 40px); /* 0mm = Schwelle fluchtet mit Kabinenboden */
      background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
      border: 1px solid #94a3b8;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 2;
    }
    .car-ceiling {
      height: 2px;
      background: #94a3b8;
    }
    .car-interior {
      height: 100%;
      border-left: 2px dashed #334155;
      border-right: 2px dashed #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .car-indicator {
      font-family: monospace;
      font-size: 0.65rem;
      color: #38bdf8;
      font-weight: bold;
    }
    /* Kabinenschwelle (Bodenkante) */
    .car-sill {
      height: 3px;
      background: #38bdf8;
      border-radius: 1px;
      box-shadow: 0 0 5px rgba(56, 189, 248, 0.8);
    }

    /* Edelstahl Taster */
    .tableau-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
      border: 1px solid #64748b;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.3);
      transition: all 0.1s;
    }
    .tableau-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.6), inset 0 2px 4px rgba(0,0,0,0.5);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Tabelle der Messwerte */
    .table-section {
      background: #0f1115;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th {
      text-align: left;
      padding: 6px 4px;
      color: #94a3b8;
      border-bottom: 1px solid #1e293b;
      text-transform: uppercase;
      font-size: 0.7rem;
    }
    td {
      padding: 8px 4px;
      border-bottom: 1px solid #171920;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      display: inline-block;
    }
    .b-ok { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .b-warn { background: #78350f; color: #fde047; border: 1px solid #d97706; }
    .b-err { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }

    .del-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
    }
    .del-btn:hover { color: #f87171; }
  </style>
</head>
<body>

  <div class="tableau">
    <div class="screw s-tl"></div>
    <div class="screw s-tr"></div>
    <div class="screw s-bl"></div>
    <div class="screw s-br"></div>

    <a href="index.html" class="nav-back">‹ Hauptmenü</a>

    <!-- Digitalanzeige oben -->
    <div class="display-bezel">
      <div class="display-title">Bündigkeit EN 81-20</div>
      <div class="dot-matrix" id="displayReadout">0 mm</div>
    </div>

    <!-- Hauptbereich: Formular & animierter Schacht -->
    <div class="main-view">
      <form class="form-panel" id="levellingForm" onsubmit="saveEntry(event)">
        <div class="field">
          <label for="floor">Etage</label>
          <input type="text" id="floor" placeholder="z. B. EG" required>
        </div>

        <div class="field">
          <label for="dir">Richtung</label>
          <select id="dir">
            <option value="▲ Auf">▲ Aufwärts</option>
            <option value="▼ Ab">▼ Abwärts</option>
          </select>
        </div>

        <div class="field">
          <label for="offset">Abweichung (mm)</label>
          <input type="number" id="offset" value="0" step="1" oninput="updateAnimation(this.value)" required>
        </div>

        <button type="submit" class="tableau-btn">Speichern</button>
      </form>

      <!-- Schacht & Kabine Animation -->
      <div class="shaft-frame">
        <div class="guide-rail rail-left"></div>
        <div class="guide-rail rail-right"></div>
        <div class="landing-sill"></div>
        <div class="sill-label">Schwelle</div>

        <div class="car-box" id="liftCar">
          <div class="car-ceiling"></div>
          <div class="car-interior">
            <span class="car-indicator" id="carFloorDisplay">KABINE</span>
          </div>
          <div class="car-sill"></div>
        </div>
      </div>
    </div>

    <!-- Protokoll / Messreihe -->
    <div class="table-section">
      <table>
        <thead>
          <tr>
            <th>Etage</th>
            <th>Richtung</th>
            <th>Versatz</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="logList"></tbody>
      </table>
    </div>
  </div>

  <script>
    let logData = JSON.parse(localStorage.getItem('buendigkeit_logs') || '[]');

    function updateAnimation(val) {
      const offset = parseFloat(val) || 0;
      const display = document.getElementById('displayReadout');
      const car = document.getElementById('liftCar');

      display.innerText = (offset > 0 ? '+' : '') + offset + ' mm';

      // 1 mm Abweichung = ca. 1.8px Verschiebung (skaliert für Schachtansicht)
      // Positiv (+) = Kabine steht zu hoch -> bewegt sich nach oben (-Y)
      const shiftY = -(offset * 1.8);
      // Begrenzung, damit die Kabine im Rahmen bleibt
      const boundedY = Math.max(Math.min(shiftY, 65), -65);
      car.style.transform = `translateY(${boundedY}px)`;
    }

    function renderLogs() {
      const tbody = document.getElementById('logList');
      tbody.innerHTML = '';

      logData.forEach((item, idx) => {
        const val = parseInt(item.offset, 10);
        const absVal = Math.abs(val);

        let badge = 'b-ok';
        let status = 'Bündig';

        if (absVal > 20) {
          badge = 'b-err';
          status = '> 20 mm';
        } else if (absVal > 10) {
          badge = 'b-warn';
          status = '> 10 mm';
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.floor}</strong></td>
          <td>${item.dir}</td>
          <td>${val > 0 ? '+' : ''}${val} mm</td>
          <td><span class="badge ${badge}">${status}</span></td>
          <td><button class="del-btn" onclick="removeEntry(${idx})">&times;</button></td>
        `;
        tbody.appendChild(tr);
      });

      localStorage.setItem('buendigkeit_logs', JSON.stringify(logData));
    }

    function saveEntry(e) {
      e.preventDefault();
      const floor = document.getElementById('floor').value.trim();
      const dir = document.getElementById('dir').value;
      const offset = document.getElementById('offset').value;

      logData.push({ floor, dir, offset });
      renderLogs();

      document.getElementById('floor').value = '';
      document.getElementById('offset').value = '0';
      updateAnimation(0);
      document.getElementById('floor').focus();
    }

    function removeEntry(idx) {
      logData.splice(idx, 1);
      renderLogs();
    }

    // Initialisierung
    renderLogs();
    updateAnimation(0);
  </script>
</body>
</html>
