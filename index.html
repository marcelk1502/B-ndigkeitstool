<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bündigkeits-Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 10%, #2f3542, #111317);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
    }

    /* Aufzugstableau Gehäuse (gebürsteter Edelstahl) */
    .tableau {
      width: 100%;
      max-width: 540px;
      background: linear-gradient(135deg, #4b525d 0%, #2e3440 25%, #4b525d 50%, #262a33 75%, #3b4250 100%);
      border: 2px solid #5a6373;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.35),
        inset 0 -2px 4px rgba(0, 0, 0, 0.6),
        0 14px 28px rgba(0, 0, 0, 0.6),
        0 0 0 1px #1a1d24;
      position: relative;
    }

    /* Schrauben in den Ecken */
    .screw {
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #8a94a6, #2d323b);
      border-radius: 50%;
      box-shadow: inset 0 1px 1px #fff, 0 1px 2px #000;
    }
    .screw::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 1px;
      width: 8px;
      height: 1.5px;
      background: #111;
    }
    .s-tl { top: 10px; left: 10px; }
    .s-tr { top: 10px; right: 10px; }
    .s-bl { bottom: 10px; left: 10px; }
    .s-br { bottom: 10px; right: 10px; }

    .nav-back {
      display: inline-block;
      color: #79b8ff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    /* Digitalanzeige oben */
    .display-bezel {
      background: #08090b;
      border: 2px solid #23272f;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9);
    }
    .display-title {
      font-family: "Courier New", monospace;
      font-size: 0.9rem;
      color: #38bdf8;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    .dot-matrix {
      font-family: "Courier New", monospace;
      font-size: 1.15rem;
      font-weight: bold;
      color: #f59e0b;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
    }

    /* Hauptbereich: links Liste der Haltestellen, rechts Schachtanimation */
    .inspection-layout {
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 14px;
      margin-bottom: 16px;
    }

    /* Etagen-Tabelle / Eingabegitter */
    .floors-container {
      background: #121418;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 420px;
      overflow-y: auto;
    }

    .floor-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1c2027;
      border: 1px solid #2d333f;
      border-radius: 6px;
      padding: 6px 8px;
      transition: border-color 0.2s;
    }
    .floor-row:focus-within {
      border-color: #38bdf8;
    }

    .floor-name {
      font-weight: 700;
      font-size: 0.85rem;
      color: #cbd5e1;
      min-width: 32px;
      text-align: center;
    }

    .dir-tag {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: bold;
    }

    .val-input {
      width: 58px;
      padding: 6px 4px;
      background: #0f1115;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #fff;
      font-size: 0.9rem;
      text-align: right;
      outline: none;
    }
    .val-input:focus {
      border-color: #38bdf8;
    }

    .val-unit {
      font-size: 0.7rem;
      color: #64748b;
    }

    .status-indicator {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #334155;
      margin-left: auto;
      border: 1px solid #475569;
      flex-shrink: 0;
    }
    .st-ok { background: #10b981; border-color: #059669; box-shadow: 0 0 6px #10b981; }
    .st-warn { background: #f59e0b; border-color: #d97706; box-shadow: 0 0 6px #f59e0b; }
    .st-err { background: #ef4444; border-color: #dc2626; box-shadow: 0 0 6px #ef4444; }

    /* Rechter Schacht */
    .shaft-frame {
      background: #090a0d;
      border: 2px solid #334155;
      border-radius: 8px;
      position: relative;
      height: 420px;
      overflow: hidden;
      box-shadow: inset 0 0 12px #000;
    }
    .guide-rail {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(90deg, #64748b, #334155);
    }
    .rail-left { left: 8px; }
    .rail-right { right: 8px; }

    /* Schwellen-Linie */
    .sill-marker {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: #ef4444;
      z-index: 4;
      box-shadow: 0 0 4px #ef4444;
    }
    .sill-text {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-105%);
      font-size: 0.55rem;
      color: #ef4444;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Aufzugskabine */
    .car-box {
      position: absolute;
      left: 16px;
      right: 16px;
      height: 70px;
      top: calc(50% - 35px);
      background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
      border: 1px solid #94a3b8;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.8);
      transition: transform 0.25s ease-out;
      z-index: 2;
    }
    .car-interior {
      height: 100%;
      border-left: 1px dashed #334155;
      border-right: 1px dashed #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .car-level-text {
      font-family: monospace;
      font-size: 0.65rem;
      color: #38bdf8;
      font-weight: bold;
    }
    .car-offset-text {
      font-family: monospace;
      font-size: 0.6rem;
      color: #f59e0b;
    }
    .car-sill {
      height: 3px;
      background: #38bdf8;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
      border-radius: 1px;
    }

    /* Footer / Aktionen */
    .actions {
      display: flex;
      gap: 10px;
    }
    .tableau-btn {
      flex: 1;
      padding: 10px;
      background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
      border: 1px solid #4b5563;
      border-radius: 6px;
      color: #f3f4f6;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    .tableau-btn:active {
      transform: translateY(1px);
      border-color: #38bdf8;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="tableau">
    <div class="screw s-tl"></div>
    <div class="screw s-tr"></div>
    <div class="screw s-bl"></div>
    <div class="screw s-br"></div>

    <a href="index.html" class="nav-back">‹ Übersicht</a>

    <div class="display-bezel">
      <div class="display-title">Bündigkeitsprüfung</div>
      <div class="dot-matrix" id="activeStatus">EN 81-20</div>
    </div>

    <div class="inspection-layout">
      <!-- Gesamtes Etagenraster auf einen Blick -->
      <div class="floors-container" id="floorsList"></div>

      <!-- Schacht mit fahrender Kabine -->
      <div class="shaft-frame">
        <div class="guide-rail rail-left"></div>
        <div class="guide-rail rail-right"></div>
        <div class="sill-marker"></div>
        <div class="sill-text">Schwelle</div>

        <div class="car-box" id="liftCar">
          <div class="car-interior">
            <span class="car-level-text" id="carActiveFloor">EG</span>
            <span class="car-offset-text" id="carActiveOffset">0 mm</span>
          </div>
          <div class="car-sill"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="tableau-btn" onclick="addFloor()">+ Etage</button>
      <button type="button" class="tableau-btn" onclick="resetValues()">Reset</button>
    </div>
  </div>

  <script>
    // Standardmäßig typische Haltestellen mit beiden Richtungen
    let floors = JSON.parse(localStorage.getItem('buendigkeit_config') || JSON.stringify([
      { name: "3.OG", dir: "▲", val: "" },
      { name: "3.OG", dir: "▼", val: "" },
      { name: "2.OG", dir: "▲", val: "" },
      { name: "2.OG", dir: "▼", val: "" },
      { name: "1.OG", dir: "▲", val: "" },
      { name: "1.OG", dir: "▼", val: "" },
      { name: "EG",   dir: "▲", val: "" },
      { name: "EG",   dir: "▼", val: "" }
    ]));

    function renderFloors() {
      const container = document.getElementById('floorsList');
      container.innerHTML = '';

      floors.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'floor-row';

        const numVal = parseFloat(item.val);
        let statusClass = '';
        if (!isNaN(numVal)) {
          const abs = Math.abs(numVal);
          if (abs <= 10) statusClass = 'st-ok';
          else if (abs <= 20) statusClass = 'st-warn';
          else statusClass = 'st-err';
        }

        row.innerHTML = `
          <span class="floor-name">${item.name}</span>
          <span class="dir-tag">${item.dir}</span>
          <input type="number" class="val-input" value="${item.val}" placeholder="0" 
                 onfocus="focusEntry(${idx})" 
                 oninput="handleInput(${idx}, this.value)">
          <span class="val-unit">mm</span>
          <div class="status-indicator ${statusClass}"></div>
        `;
        container.appendChild(row);
      });

      localStorage.setItem('buendigkeit_config', JSON.stringify(floors));
    }

    function handleInput(index, val) {
      floors[index].val = val;
      focusEntry(index);
      renderFloors();
      // Fokus im Input behalten
      const inputs = document.querySelectorAll('.val-input');
      if (inputs[index]) inputs[index].focus();
    }

    function focusEntry(index) {
      const item = floors[index];
      const val = parseFloat(item.val) || 0;
      
      document.getElementById('carActiveFloor').innerText = `${item.name} ${item.dir}`;
      document.getElementById('carActiveOffset').innerText = (val > 0 ? '+' : '') + val + ' mm';

      const statusEl = document.getElementById('activeStatus');
      const abs = Math.abs(val);
      if (item.val === "") {
        statusEl.innerText = `${item.name} ${item.dir}`;
      } else if (abs <= 10) {
        statusEl.innerText = "BÜNDIG (OK)";
      } else if (abs <= 20) {
        statusEl.innerText = "TOLERANZ (WARN)";
      } else {
        statusEl.innerText = "FEHLER (>20mm)";
      }

      // Animierte Kabinen-Verschiebung (1mm = ca. 2.5px für deutliche Sichtbarkeit)
      const shiftY = -(val * 2.5);
      const boundedY = Math.max(Math.min(shiftY, 150), -150);
      document.getElementById('liftCar').style.transform = `translateY(${boundedY}px)`;
    }

    function addFloor() {
      const name = prompt("Bezeichnung der neuen Etage:", "UG");
      if (name) {
        floors.unshift({ name, dir: "▼", val: "" });
        floors.unshift({ name, dir: "▲", val: "" });
        renderFloors();
      }
    }

    function resetValues() {
      if (confirm("Möchtest du alle Messwerte zurücksetzen?")) {
        floors.forEach(f => f.val = "");
        renderFloors();
        document.getElementById('liftCar').style.transform = 'translateY(0)';
        document.getElementById('carActiveFloor').innerText = 'KABINE';
        document.getElementById('carActiveOffset').innerText = '0 mm';
        document.getElementById('activeStatus').innerText = 'EN 81-20';
      }
    }

    renderFloors();
  </script>
</body>
</html>
