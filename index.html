<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bündigkeits-Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #2b3038, #181a1f);
      color: #e0e6ed;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: linear-gradient(145deg, #282c34, #1f2329);
      border: 1px solid #3d4450;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .back {
      display: inline-block;
      color: #007aff;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 12px;
      font-weight: 500;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      color: #fff;
    }
    p.sub {
      color: #8a94a6;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }
    .norm-info {
      background: #16181d;
      border-left: 3px solid #007aff;
      padding: 8px 12px;
      font-size: 0.75rem;
      color: #8a94a6;
      border-radius: 0 6px 6px 0;
      margin-bottom: 18px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #b0b7c3;
      margin-bottom: 6px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3e4451;
      background: #16181d;
      color: #fff;
      font-size: 1rem;
    }
    button.btn-add {
      width: 100%;
      padding: 12px;
      background: linear-gradient(180deg, #007aff, #0056b3);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 2px 8px rgba(0,122,255,0.3);
    }
    button.btn-add:active {
      transform: scale(0.98);
    }
    .table-container {
      margin-top: 24px;
      border-top: 1px solid #3d4450;
      padding-top: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      text-align: left;
      padding: 8px 6px;
      color: #8a94a6;
      border-bottom: 1px solid #373e4a;
    }
    td {
      padding: 10px 6px;
      border-bottom: 1px solid #282c35;
    }
    .status-pill {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-ok { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .status-warn { background: rgba(245, 158, 11, 0.2); color: #facc15; border: 1px solid #f59e0b; }
    .status-err { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .btn-delete {
      background: transparent;
      border: none;
      color: #8a94a6;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .btn-delete:hover {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="back">‹ Zur Hauptseite</a>
    <h1>Bündigkeits-Tool</h1>
    <p class="sub">Haltegenauigkeit & Niveauabweichungen</p>

    <div class="norm-info">
      Norm-Toleranzen (EN 81-20):<br>
      • Bündigkeit: max. <strong>±10 mm</strong> (Optimal)<br>
      • Anhaltegenauigkeit: max. <strong>±20 mm</strong> (Grenzwert)
    </div>

    <form id="entryForm" onsubmit="addEntry(event)">
      <div class="row">
        <div class="form-group" style="flex: 1;">
          <label for="floor">Etage / Haltestelle</label>
          <input type="text" id="floor" placeholder="z. B. EG, 1.OG" required>
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="direction">Fahrtrichtung</label>
          <select id="direction">
            <option value="Aufwärts">Aufwärts (▲)</option>
            <option value="Abwärts">Abwärts (▼)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="offset">Abweichung Kabine zur Schwelle (in mm)</label>
        <input type="number" id="offset" placeholder="+ für zu hoch, - für zu tief" step="1" required>
      </div>

      <button type="submit" class="btn-add">+ Messwert erfassen</button>
    </form>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Etage</th>
            <th>Richtung</th>
            <th>Wert</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="resultList">
          <!-- Dynamische Einträge -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let measurements = JSON.parse(localStorage.getItem('buendigkeit_data') || '[]');

    function renderList() {
      const tbody = document.getElementById('resultList');
      tbody.innerHTML = '';

      measurements.forEach((item, index) => {
        const val = parseInt(item.offset, 10);
        const absVal = Math.abs(val);

        let statusClass = 'status-ok';
        let statusText = 'OK';

        if (absVal > 20) {
          statusClass = 'status-err';
          statusText = '> 20mm';
        } else if (absVal > 10) {
          statusClass = 'status-warn';
          statusText = 'Warnung';
        }

        const formattedVal = (val > 0 ? '+' : '') + val + ' mm';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.floor}</strong></td>
          <td>${item.direction}</td>
          <td>${formattedVal}</td>
          <td><span class="status-pill ${statusClass}">${statusText}</span></td>
          <td><button class="btn-delete" onclick="deleteEntry(${index})" title="Löschen">&times;</button></td>
        `;
        tbody.appendChild(tr);
      });

      localStorage.setItem('buendigkeit_data', JSON.stringify(measurements));
    }

    function addEntry(e) {
      e.preventDefault();
      const floor = document.getElementById('floor').value.trim();
      const direction = document.getElementById('direction').value;
      const offset = document.getElementById('offset').value;

      measurements.push({ floor, direction, offset });
      renderList();

      document.getElementById('floor').value = '';
      document.getElementById('offset').value = '';
      document.getElementById('floor').focus();
    }

    function deleteEntry(index) {
      measurements.splice(index, 1);
      renderList();
    }

    renderList();
  </script>
</body>
</html>
