<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bündigkeit">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230284c7'/><text y='.9em' x='18' font-size='70' fill='white'>⇕</text></svg>">
<title>Bündigkeitsmessung</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-elevated: #ffffff;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-subtle: #94a3b8;
    
    --primary: #0284c7;
    --primary-bg: #e0f2fe;
    
    --ok: #10b981;
    --ok-bg: #ecfdf5;
    --ok-border: #a7f3d0;
    --ok-text: #065f46;

    --bad: #ef4444;
    --bad-bg: #fef2f2;
    --bad-border: #fecaca;
    --bad-text: #991b1b;

    --na-bg: #f8fafc;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b111a;
      --surface: #151e2b;
      --surface-elevated: #1e293b;
      --border: #243244;
      --border-strong: #334458;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;

      --primary: #38bdf8;
      --primary-bg: #0c4a6e;

      --ok: #34d399;
      --ok-bg: #064e3b33;
      --ok-border: #05966955;
      --ok-text: #6ee7b7;

      --bad: #f87171;
      --bad-bg: #7f1d1d33;
      --bad-border: #dc262655;
      --bad-text: #fca5a5;

      --na-bg: #11182755;
      --shadow-sm: none;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: env(safe-area-inset-top, 10px) 8px calc(env(safe-area-inset-bottom, 16px) + 24px);
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  .layout-wrap {
    display: flex;
    justify-content: center;
    gap: 8px;
    max-width: 600px;
    margin: 0 auto;
    position: relative;
  }

  .app-container {
    flex: 1;
    min-width: 0;
  }

  /* Grafischer Mini-Schacht (dauerhaft sichtbar auf allen Screens) */
  .shaft-panel {
    width: 28px;
    flex: none;
    position: sticky;
    top: calc(env(safe-area-inset-top, 10px) + 54px);
    align-self: flex-start;
    background: var(--surface);
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 6px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .shaft-title {
    font-size: 0.55rem;
    font-weight: 800;
    color: var(--text-muted);
    text-align: center;
    line-height: 1;
    margin-bottom: 2px;
    text-transform: uppercase;
  }

  .shaft-node {
    width: 22px;
    height: 18px;
    border-radius: 4px;
    background: var(--border);
    font-size: 0.65rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    cursor: pointer;
    transition: transform 0.1s, background-color 0.2s;
  }

  .shaft-node:active { transform: scale(0.9); }
  .shaft-node.ok { background: var(--ok); color: #fff; }
  .shaft-node.bad { background: var(--bad); color: #fff; }
  .shaft-node.partial { background: var(--primary); color: #fff; }

  /* Header Sticky */
  header.top-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    padding-top: 4px;
    padding-bottom: 6px;
    backdrop-filter: blur(12px);
  }

  .nav-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .title-group h1 {
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .badges {
    display: flex;
    gap: 6px;
  }

  .badge {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 99px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    box-shadow: var(--shadow-sm);
  }

  .badge.alert {
    background: var(--bad-bg);
    color: var(--bad-text);
    border-color: var(--bad-border);
  }

  .progress-wrap {
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), #6366f1);
    border-radius: 99px;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Settings Dropdown */
  details.settings-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin: 8px 0 12px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  details.settings-card summary {
    list-style: none;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.88rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }

  details.settings-card summary::-webkit-details-marker { display: none; }
  details.settings-card summary .icon-arrow {
    transition: transform 0.2s;
    fill: currentColor;
  }
  details.settings-card[open] summary .icon-arrow { transform: rotate(180deg); }

  .settings-content {
    padding: 4px 14px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  .settings-grid {
    display: grid;
    grid-template-columns: 1.3fr 0.85fr 1.3fr;
    gap: 8px;
    margin-top: 10px;
  }

  .setting-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-muted);
  }

  .setting-item input {
    height: 38px;
    width: 100%;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
  }

  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .btn {
    flex: 1;
    height: 38px;
    border-radius: var(--radius-sm);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  .btn:active { transform: scale(0.97); }

  .btn.danger {
    border-color: var(--bad-border);
    background: var(--bad-bg);
    color: var(--bad-text);
  }
  .btn.danger.armed {
    background: var(--bad);
    color: #fff;
    border-color: var(--bad);
  }

  /* Spaltenköpfe */
  .grid-header {
    position: sticky;
    top: 48px;
    z-index: 15;
    background: var(--bg);
    display: grid;
    grid-template-columns: 42px 1fr 1fr;
    gap: 6px;
    padding: 4px 0 8px;
  }

  .header-pill {
    background: var(--surface);
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 7px 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--text);
    box-shadow: var(--shadow-sm);
    letter-spacing: -0.01em;
  }

  .header-pill.up {
    color: var(--primary);
    border-color: rgba(2, 132, 199, 0.4);
    background: linear-gradient(180deg, var(--surface), var(--primary-bg));
  }

  .header-pill.down {
    color: #8b5cf6;
    border-color: rgba(139, 92, 246, 0.4);
    background: linear-gradient(180deg, var(--surface), rgba(139, 92, 246, 0.1));
  }

  /* Etagenliste */
  .floor-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .floor-card {
    background: var(--surface);
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    display: grid;
    grid-template-columns: 42px 1fr 1fr;
    overflow: hidden;
    scroll-margin-top: 100px;
  }

  .floor-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 800;
    background: var(--bg);
    border-right: 1.5px solid var(--border);
    color: var(--text);
    user-select: none;
  }

  .cell-card {
    padding: 8px 6px 6px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    background: transparent;
    transition: background 0.2s;
  }

  .cell-card.dir-down {
    border-left: 2px dashed var(--border-strong);
  }

  .cell-card.ok { background: var(--ok-bg); }
  .cell-card.bad { background: var(--bad-bg); }

  .cell-card.na {
    background: var(--na-bg);
    color: var(--text-subtle);
    font-size: 0.72rem;
    font-weight: 700;
    align-items: center;
    justify-content: center;
  }

  .cell-main {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-sign {
    flex: none;
    width: 32px;
    height: 42px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface-elevated);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
  }

  .btn-sign:active { transform: scale(0.92); }

  .input-wrapper { flex: 1; min-width: 0; }

  .val-input {
    width: 100%;
    height: 42px;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface-elevated);
    color: var(--text);
    font: inherit;
    font-size: 1.15rem;
    font-weight: 800;
    text-align: center;
    padding: 0;
    outline: none;
    box-shadow: var(--shadow-sm);
  }

  .val-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
  }

  /* Pegelanzeige */
  .gauge-container {
    flex: none;
    width: 11px;
    height: 42px;
    background: var(--border);
    border-radius: 99px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .gauge-tolerance {
    position: absolute;
    left: 0; right: 0;
    background: var(--ok);
    opacity: 0.45;
  }

  .gauge-center-line {
    position: absolute;
    left: 0; right: 0;
    top: calc(50% - 0.5px);
    height: 1px;
    background: var(--text-muted);
  }

  .gauge-pointer {
    position: absolute;
    left: 1px;
    width: 9px;
    height: 6px;
    border-radius: 3px;
    background: var(--text);
    top: calc(50% - 3px);
    display: none;
    transition: top 0.18s cubic-bezier(0.1, 0.9, 0.2, 1);
  }

  .cell-card.ok .gauge-pointer { display: block; background: var(--ok); }
  .cell-card.bad .gauge-pointer { display: block; background: var(--bad); }

  .status-text {
    font-size: 0.7rem;
    font-weight: 700;
    margin-top: 3px;
    text-align: center;
    color: var(--text-subtle);
    min-height: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell-card.ok .status-text { color: var(--ok-text); }
  .cell-card.bad .status-text { color: var(--bad-text); }
</style>
</head>
<body>

<div class="layout-wrap">
  <div class="app-container">
    <!-- Sticky Top Bar -->
    <header class="top-bar">
      <div class="nav-header">
        <div class="title-group">
          <h1>Bündigkeit</h1>
        </div>
        <div class="badges">
          <span class="badge alert" id="chipBad" hidden>0 Abweichungen</span>
          <span class="badge" id="chipCount">0 / 0</span>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" id="progressBar"></div>
      </div>
    </header>

    <!-- Einstellungen -->
    <details class="settings-card" id="settingsDetails">
      <summary>
        <span>⚙️ Einstellungen</span>
        <svg class="icon-arrow" width="16" height="16" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </summary>
      <div class="settings-content">
        <div class="settings-grid">
          <label class="setting-item">
            Etagenanzahl
            <input id="floorCount" type="number" min="1" max="50" inputmode="numeric" value="5">
          </label>
          <label class="setting-item">
            Start
            <input id="startFloor" type="number" inputmode="numeric" value="0">
          </label>
          <label class="setting-item">
            Toleranz (± mm)
            <input id="tolerance" type="number" min="0" step="1" inputmode="numeric" value="5">
          </label>
        </div>
        <div class="action-row">
          <button type="button" class="btn" id="copyBtn">📋 Bericht kopieren</button>
          <button type="button" class="btn danger" id="resetBtn">Werte leeren</button>
        </div>
      </div>
    </details>

    <!-- Tabellenkopf -->
    <div class="grid-header">
      <div class="header-pill">Et.</div>
      <div class="header-pill up">▲ Aufwärts</div>
      <div class="header-pill down">▼ Abwärts</div>
    </div>

    <!-- Etagenliste -->
    <main class="floor-list" id="listContainer"></main>
  </div>

  <!-- Grafischer Mini-Aufzug / Schacht (rechts) -->
  <aside class="shaft-panel" id="shaftPanel" aria-label="Schacht-Übersicht">
    <div class="shaft-title">Et.</div>
    <div id="shaftNodes" style="display:flex; flex-direction:column; gap:4px; width:100%; align-items:center;"></div>
  </aside>
</div>

<script>
  const STORAGE_KEY = 'buendigkeit-v5';
  let state = {
    floorCount: 5,
    startFloor: 0,
    tolerance: 5,
    values: {}
  };

  const $ = id => document.getElementById(id);

  function loadState() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) state = Object.assign(state, JSON.parse(data));
    } catch (e) {}
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function parseVal(v) {
    if (v === '' || v == null) return null;
    const n = parseInt(v, 10);
    return isNaN(n) ? null : n;
  }

  function readSettings() {
    state.floorCount = Math.min(50, Math.max(1, parseInt($('floorCount').value, 10) || 1));
    state.startFloor = parseInt($('startFloor').value, 10) || 0;
    const t = parseInt($('tolerance').value, 10);
    state.tolerance = isNaN(t) ? 5 : Math.abs(t);
  }

  function renderCell(floor, dir) {
    const isBottom = floor === state.startFloor;
    const isTop = floor === state.startFloor + state.floorCount - 1;
    const dirClass = dir === 'down' ? 'dir-down' : 'dir-up';

    if ((dir === 'up' && isBottom) || (dir === 'down' && isTop)) {
      return `<div class="cell-card ${dirClass} na">Nicht anfahrbar</div>`;
    }

    const key = `${floor}:${dir}`;
    const val = state.values[key] ?? '';

    return `
      <div class="cell-card ${dirClass}" data-key="${key}" data-floor="${floor}" data-dir="${dir}">
        <div class="cell-main">
          <button type="button" class="btn-sign" tabindex="-1" title="Vorzeichen wechseln">±</button>
          <div class="input-wrapper">
            <input type="text" class="val-input" inputmode="numeric" placeholder="0" value="${val}" enterkeyhint="next">
          </div>
          <div class="gauge-container" title="Doppelklick für 0 mm">
            <div class="gauge-tolerance"></div>
            <div class="gauge-center-line"></div>
            <div class="gauge-pointer"></div>
          </div>
        </div>
        <div class="status-text"></div>
      </div>
    `;
  }

  function renderShaft() {
    const shaft = $('shaftNodes');
    let html = '';
    for (let f = state.startFloor + state.floorCount - 1; f >= state.startFloor; f--) {
      html += `<div class="shaft-node" id="shaft-node-${f}" onclick="scrollToFloor(${f})">${f}</div>`;
    }
    shaft.innerHTML = html;
  }

  window.scrollToFloor = function(floor) {
    const el = document.getElementById(`floor-card-${floor}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  function renderList() {
    readSettings();
    const container = $('listContainer');
    let html = '';

    for (let f = state.startFloor + state.floorCount - 1; f >= state.startFloor; f--) {
      html += `
        <div class="floor-card" id="floor-card-${f}">
          <div class="floor-label">${f}</div>
          ${renderCell(f, 'up')}
          ${renderCell(f, 'down')}
        </div>
      `;
    }

    container.innerHTML = html;
    renderShaft();
    container.querySelectorAll('.cell-card[data-key]').forEach(applyCellStyles);
    updateMetrics();
    saveState();
  }

  function applyCellStyles(card) {
    const input = card.querySelector('.val-input');
    const n = parseVal(input.value);
    const status = card.querySelector('.status-text');
    const pointer = card.querySelector('.gauge-pointer');
    const tolBand = card.querySelector('.gauge-tolerance');

    card.classList.remove('ok', 'bad');

    if (n === null) {
      status.textContent = '';
      return;
    }

    const isExceeded = Math.abs(n) > state.tolerance;
    card.classList.add(isExceeded ? 'bad' : 'ok');

    if (n === 0) {
      status.textContent = 'Exakt bündig';
    } else if (n > 0) {
      status.textContent = `+${n} mm zu hoch`;
    } else {
      status.textContent = `${n} mm zu tief`;
    }

    const tolerance = Math.max(state.tolerance, 1);
    const range = Math.max(12, tolerance * 1.6);
    const tolPercent = Math.min(50, (tolerance / range) * 50);

    tolBand.style.top = (50 - tolPercent) + '%';
    tolBand.style.height = (tolPercent * 2) + '%';

    const clamped = Math.max(-range, Math.min(range, n));
    const normalized = (clamped / range);
    const topPct = 50 - (normalized * 50);
    pointer.style.top = `calc(${topPct}% - 3px)`;
  }

  function updateMetrics() {
    const cells = document.querySelectorAll('.cell-card[data-key]');
    let filled = 0;
    let bad = 0;

    cells.forEach(c => {
      if (c.classList.contains('bad')) { bad++; filled++; }
      else if (c.classList.contains('ok')) { filled++; }
    });

    const total = cells.length;
    $('chipCount').textContent = `${filled} / ${total} gemessen`;
    
    const chipBad = $('chipBad');
    if (bad > 0) {
      chipBad.hidden = false;
      chipBad.textContent = `${bad} Toleranzfehler`;
    } else {
      chipBad.hidden = true;
    }

    const pct = total ? (filled / total * 100) : 0;
    $('progressBar').style.width = pct + '%';

    // Mini-Schacht Visualisierung
    for (let f = state.startFloor + state.floorCount - 1; f >= state.startFloor; f--) {
      const node = $(`shaft-node-${f}`);
      if (!node) continue;
      const up = parseVal(state.values[`${f}:up`]);
      const dn = parseVal(state.values[`${f}:down`]);
      
      const isTop = f === state.startFloor + state.floorCount - 1;
      const isBottom = f === state.startFloor;
      
      const upBad = up !== null && Math.abs(up) > state.tolerance;
      const dnBad = dn !== null && Math.abs(dn) > state.tolerance;

      node.classList.remove('ok', 'bad', 'partial');

      if (upBad || dnBad) {
        node.classList.add('bad');
      } else {
        const upComplete = isBottom || up !== null;
        const dnComplete = isTop || dn !== null;
        if (upComplete && dnComplete) {
          node.classList.add('ok');
        } else if ((up !== null && !isBottom) || (dn !== null && !isTop)) {
          node.classList.add('partial');
        }
      }
    }
  }

  const container = $('listContainer');

  // Vorzeichen Toggle
  container.addEventListener('click', e => {
    const signBtn = e.target.closest('.btn-sign');
    if (signBtn) {
      const input = signBtn.closest('.cell-card').querySelector('.val-input');
      if (input.value) {
        input.value = input.value.startsWith('-') ? input.value.slice(1) : '-' + input.value;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
  });

  // Doppelklick für Null-Bündig
  container.addEventListener('dblclick', e => {
    const card = e.target.closest('.cell-card');
    if (!card || card.classList.contains('na')) return;
    const input = card.querySelector('.val-input');
    if (input) {
      input.value = '0';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      advanceDirectional(card);
    }
  });

  // Richtungsabhängiges Weiterspringen bei Enter
  container.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const card = e.target.closest('.cell-card');
      if (card) advanceDirectional(card);
    }
  });

  function advanceDirectional(currentCard) {
    const floor = parseInt(currentCard.dataset.floor, 10);
    const dir = currentCard.dataset.dir;
    let targetCard = null;

    if (dir === 'up') {
      // Aufwärts -> Springe in die Etage darüber (floor + 1), ebenfalls Spalte 'up'
      const nextFloor = floor + 1;
      targetCard = container.querySelector(`.cell-card[data-key="${nextFloor}:up"]`);
    } else if (dir === 'down') {
      // Abwärts -> Springe in die Etage darunter (floor - 1), ebenfalls Spalte 'down'
      const nextFloor = floor - 1;
      targetCard = container.querySelector(`.cell-card[data-key="${nextFloor}:down"]`);
    }

    if (targetCard) {
      const nextInput = targetCard.querySelector('.val-input');
      if (nextInput) {
        nextInput.focus();
        nextInput.select();
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    } else {
      // Am Ende der Fahrt angekommen: Fokus lösen
      const currentInput = currentCard.querySelector('.val-input');
      if (currentInput) currentInput.blur();
    }
  }

  container.addEventListener('input', e => {
    const input = e.target;
    if (!input.classList.contains('val-input')) return;

    let val = input.value.trim();
    const isNeg = val.startsWith('-');
    val = val.replace(/[^0-9]/g, '');
    input.value = (isNeg ? '-' : '') + val;

    const card = input.closest('.cell-card');
    const key = card.dataset.key;

    if (input.value === '' || input.value === '-') {
      delete state.values[key];
    } else {
      state.values[key] = input.value;
    }

    applyCellStyles(card);
    updateMetrics();
    saveState();
  });

  ['floorCount', 'startFloor', 'tolerance'].forEach(id => {
    $(id).addEventListener('input', renderList);
  });

  let armTimer = null;
  $('resetBtn').addEventListener('click', function () {
    if (!this.classList.contains('armed')) {
      this.classList.add('armed');
      this.textContent = 'Wirklich leeren?';
      armTimer = setTimeout(() => {
        this.classList.remove('armed');
        this.textContent = 'Werte leeren';
      }, 3500);
      return;
    }
    clearTimeout(armTimer);
    this.classList.remove('armed');
    this.textContent = 'Werte leeren';
    state.values = {};
    renderList();
  });

  $('copyBtn').addEventListener('click', async () => {
    let report = `Bündigkeitsmessung (Toleranz: ±${state.tolerance} mm)\n`;
    report += `------------------------------------\n`;
    for (let f = state.startFloor + state.floorCount - 1; f >= state.startFloor; f--) {
      const up = state.values[`${f}:up`] !== undefined ? `${state.values[`${f}:up`]} mm` : (f === state.startFloor ? '—' : 'offen');
      const dn = state.values[`${f}:down`] !== undefined ? `${state.values[`${f}:down`]} mm` : (f === state.startFloor + state.floorCount - 1 ? '—' : 'offen');
      report += `Etage ${f.toString().padStart(2, ' ')} | ▲ Auf: ${up.padEnd(8, ' ')} | ▼ Ab: ${dn}\n`;
    }
    try {
      await navigator.clipboard.writeText(report);
      const btn = $('copyBtn');
      const orig = btn.textContent;
      btn.textContent = '✓ Kopiert!';
      setTimeout(() => btn.textContent = orig, 2000);
    } catch(err) {
      alert(report);
    }
  });

  loadState();
  $('floorCount').value = state.floorCount;
  $('startFloor').value = state.startFloor;
  $('tolerance').value = state.tolerance;
  renderList();
</script>
</body>
</html>
