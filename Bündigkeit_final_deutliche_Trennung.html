<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bündigkeit</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #e8edf1; --surface: #ffffff; --line: #d3dce3;
    --ink: #14212b; --muted: #5a6b78;
    --accent: #0f6b7a; --accent-ink: #ffffff;
    --ok: #1f8a4c; --ok-bg: #ddf3e4;
    --bad: #c0392b; --bad-bg: #fbe0dc;
    --na: #f0f3f6;
    --track: #cfd8df;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d151b; --surface: #16222b; --line: #26353f;
      --ink: #e8eff4; --muted: #94a6b3;
      --accent: #4cc3d6; --accent-ink: #062229;
      --ok: #55d58a; --ok-bg: #143d27;
      --bad: #ff8a7a; --bad-bg: #4a1e1a;
      --na: #111b22; --track: #33444f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d151b; --surface: #16222b; --line: #26353f;
    --ink: #e8eff4; --muted: #94a6b3;
    --accent: #4cc3d6; --accent-ink: #062229;
    --ok: #55d58a; --ok-bg: #143d27;
    --bad: #ff8a7a; --bad-bg: #4a1e1a;
    --na: #111b22; --track: #33444f;
  }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 8px 40px; }

  /* Kopf: bleibt beim Scrollen sichtbar */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); padding: 8px 0 6px;
  }
  .titlebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 800; letter-spacing: -.01em; }
  .badges { display: flex; gap: 6px; align-items: center; }
  .chip { font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .chip[hidden] { display: none; }
  .progress { height: 3px; background: var(--line); border-radius: 3px; margin: 8px 0 6px; overflow: hidden; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .cols, .row { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 6px; align-items: center; }
  .cols {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 48px);
    z-index: 4;
    background: var(--bg);
    padding: 4px 6px 6px;
    font-size: .78rem;
    font-weight: 800;
    color: var(--muted);
    text-align: center;
  }
  .cols span {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 3px;
    line-height: 1.1;
  }
  .cols span:nth-child(2) { color: var(--accent); }
  .cols span:nth-child(3) { color: var(--accent); }

  /* Einstellungen */
  details.settings { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin: 4px 0 12px; }
  details.settings summary {
    list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 700; font-size: .95rem;
    display: flex; justify-content: space-between; align-items: center; min-height: 48px;
  }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings summary::after { content: "▾"; color: var(--muted); transition: transform .2s; }
  details.settings[open] summary::after { transform: rotate(180deg); }
  .settings-body { padding: 0 16px 16px; }
  .setgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .setgrid label { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--muted); }
  .setgrid input {
    width: 100%; height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg);
    color: var(--ink); font: inherit; font-size: 1.1rem; font-weight: 700; text-align: center;
  }
  .danger {
    margin-top: 14px; width: 100%; height: 46px; border-radius: 10px; border: 1.5px solid var(--bad);
    background: transparent; color: var(--bad); font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer;
  }
  .danger.armed { background: var(--bad); color: var(--surface); }

  /* Etagen */
  #list { display: flex; flex-direction: column; gap: 6px; }
  main {
    position: relative;
  }
  main::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 100px;
    left: calc(50% + 17px);
    width: 3px;
    background: var(--text);
    opacity: .65;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.04);
    pointer-events: none;
    z-index: 3;
  }
  .row {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 6px;
  }
  .floor { text-align: center; font-size: 1.2rem; font-weight: 800; line-height: 1; }
  .fld { border-radius: 9px; padding: 8px 4px 6px; border: 1.5px solid transparent; background: var(--bg); min-height: 0; }
  .fld.ok { background: var(--ok-bg); }
  .fld.bad { background: var(--bad-bg); }
  .fld.na { background: var(--na); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .7rem; border: 1.5px dashed var(--line); align-self: stretch; }
  .ctl { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .sgn {
    flex: none; width: 28px; height: 34px; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 800; font-size: .7rem; cursor: pointer; padding: 0;
  }
  .sgn:active { transform: scale(.94); }
  .fld input {
    flex: none; min-width: 0; width: 46px; height: 34px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface);
    color: var(--ink); font: inherit; font-size: 1rem; font-weight: 800; text-align: center; padding: 0;
  }
  .fld input::placeholder { color: var(--track); }
  input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hint { display: block; margin-top: 6px; text-align: center; font-size: .68rem; font-weight: 600; color: var(--muted); min-height: 1em; line-height: 1; white-space: nowrap; }
  .fld.ok .hint { color: var(--ok); }
  .fld.bad .hint { color: var(--bad); }

  /* Anzeige: Marker wandert nach oben (zu hoch) oder unten (zu tief) */
  .gauge { position: relative; flex: none; width: 12px; height: 50px; border-radius: 6px; background: var(--track); }
  .gauge .band { position: absolute; left: 0; right: 0; background: var(--ok); opacity: .35; }
  .gauge .mid { position: absolute; left: -3px; right: -3px; top: calc(50% - 1px); height: 2px; background: var(--ink); opacity: .55; }
  .gauge .mark { position: absolute; left: -3px; width: 18px; height: 9px; border-radius: 5px; background: var(--muted); top: calc(50% - 4.5px); display: none; transition: top .2s; }
  .fld.ok .mark { background: var(--ok); display: block; }
  .fld.bad .mark { background: var(--bad); display: block; }

  #errbox { color: var(--bad); font-size: .85rem; margin: 12px 4px 0; }
  @media (prefers-reduced-motion: reduce) {
    .progress span, .gauge .mark, details.settings summary::after { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titlebar">
      <h1>Bündigkeit</h1>
      <div class="badges">
        <span class="chip bad" id="chipBad" hidden></span>
        <span class="chip" id="chipCount"></span>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  </header>

  <details class="settings" id="settings">
    <summary>Einstellungen</summary>
    <div class="settings-body">
      <div class="setgrid">
        <label>Etagen <input id="floorCount" type="number" min="1" max="50" inputmode="numeric" value="5"></label>
        <label>Start-Etage <input id="startFloor" type="number" inputmode="numeric" value="0"></label>
        <label>Toleranz ± mm <input id="tolerance" type="number" min="0" step="1" inputmode="numeric" value="5"></label>
      </div>
      <button type="button" class="danger" id="resetBtn">Alle Werte löschen</button>
    </div>
  </details>

  <div class="cols" aria-label="Spalten">
    <span>Et.</span><span>▲ Aufwärts</span><span>▼ Abwärts</span>
  </div>
  <main id="list"></main>
  <noscript><p style="color:#c0392b">JavaScript ist nicht verfügbar. Bitte die Seite in einem Browser öffnen, nicht in der Datei-Vorschau.</p></noscript>
  <p id="errbox"></p>
</div>

<script>
  window.onerror = function (msg, src, line) {
    var el = document.getElementById('errbox');
    if (el) el.textContent = 'Fehler: ' + msg + ' (Zeile ' + line + ')';
  };

  const KEY = 'buendigkeit-v1';
  let state = { floorCount: 5, startFloor: 0, tolerance: 5, values: {} };
  const $ = id => document.getElementById(id);

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) state = Object.assign(state, JSON.parse(raw));
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function parseVal(v) {
    if (v === '' || v == null) return null;
    const n = parseInt(v, 10);
    return isNaN(n) ? null : n;
  }

  function readSettings() {
    state.floorCount = Math.min(50, Math.max(1, parseInt($('floorCount').value, 10) || 1));
    state.startFloor = parseInt($('startFloor').value, 10) || 0;
    const t = parseInt($('tolerance').value, 10);
    state.tolerance = isNaN(t) ? 5 : Math.abs(t);
  }

  function cellHtml(i, d) {
    const bottom = i === state.startFloor;
    const top = i === state.startFloor + state.floorCount - 1;
    if ((d === 'up' && bottom) || (d === 'down' && top)) {
      return '<div class="fld na">entfällt</div>';
    }
    const v = state.values[i + ':' + d];
    return '<div class="fld" data-key="' + i + ':' + d + '">' +
      '<div class="ctl">' +
        '<button type="button" class="sgn" tabindex="-1" aria-label="Vorzeichen wechseln">+/−</button>' +
        '<input type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Abweichung in mm" value="' + (v != null ? v : '') + '">' +
        '<div class="gauge" aria-hidden="true"><i class="band"></i><i class="mid"></i><b class="mark"></b></div>' +
      '</div>' +
      '<small class="hint"></small>' +
    '</div>';
  }

  function renderList() {
    readSettings();
    const list = $('list');
    let html = '';
    for (let i = state.startFloor + state.floorCount - 1; i >= state.startFloor; i--) {
      html += '<div class="row"><div class="floor">' + i + '</div>' + cellHtml(i, 'up') + cellHtml(i, 'down') + '</div>';
    }
    list.innerHTML = html;
    list.querySelectorAll('.fld[data-key]').forEach(applyCell);
    updateSummary();
    save();
  }

  function applyCell(fld) {
    const inp = fld.querySelector('input');
    const n = parseVal(inp.value);
    fld.classList.remove('ok', 'bad');
    const hint = fld.querySelector('.hint');
    const mark = fld.querySelector('.mark');
    if (n === null) { hint.textContent = ''; return; }
    fld.classList.add(Math.abs(n) > state.tolerance ? 'bad' : 'ok');
    hint.textContent = n > 0 ? n + ' mm zu hoch' : n < 0 ? Math.abs(n) + ' mm zu tief' : 'bündig';
    const tolerance = Math.max(state.tolerance, 1);

    // Fester sichtbarer Bereich: -10 bis +10 mm.
    // Die Toleranz definiert ausschließlich den grünen Bereich in der Mitte.
    // Alles außerhalb der Toleranz bleibt grau und der Marker zeigt die Abweichung.
    const displayRange = Math.max(10, tolerance * 1.5);
    const greenHalf = Math.min(50, (tolerance / displayRange) * 50);
    const greenTop = 50 - greenHalf;

    const band = fld.querySelector('.band');
    band.style.top = greenTop + '%';
    band.style.height = (greenHalf * 2) + '%';

    const pos = Math.max(-1, Math.min(1, n / displayRange));
    mark.style.top = 'calc(' + (50 - pos * 50) + '% - 4.5px)';
  }

  function updateSummary() {
    const cells = document.querySelectorAll('.fld[data-key]');
    let filled = 0, bad = 0;
    cells.forEach(f => {
      if (f.classList.contains('bad')) { bad++; filled++; }
      else if (f.classList.contains('ok')) filled++;
    });
    $('chipCount').textContent = filled + ' von ' + cells.length;
    const cb = $('chipBad');
    cb.hidden = bad === 0;
    cb.textContent = bad + ' außerhalb';
    $('bar').style.width = (cells.length ? (filled / cells.length * 100) : 0) + '%';
  }

  const list = $('list');
  list.addEventListener('click', function (e) {
    const btn = e.target.closest('.sgn');
    if (!btn) return;
    const inp = btn.parentElement.querySelector('input');
    inp.value = inp.value.startsWith('-') ? inp.value.slice(1) : '-' + inp.value;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.focus();
  });
  list.addEventListener('input', function (e) {
    const inp = e.target;
    if (inp.tagName !== 'INPUT') return;
    const neg = inp.value.trim().startsWith('-');
    inp.value = (neg ? '-' : '') + inp.value.replace(/[^0-9]/g, '');
    const fld = inp.closest('.fld');
    const k = fld.dataset.key;
    if (inp.value === '') delete state.values[k]; else state.values[k] = inp.value;
    applyCell(fld);
    updateSummary();
    save();
  });

  ['floorCount', 'startFloor', 'tolerance'].forEach(id => $(id).addEventListener('input', renderList));

  // Zweistufiges Löschen ohne Systemdialog
  let armTimer = null;
  $('resetBtn').addEventListener('click', function () {
    const b = this;
    if (!b.classList.contains('armed')) {
      b.classList.add('armed');
      b.textContent = 'Wirklich alle Werte löschen?';
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    clearTimeout(armTimer);
    state.values = {};
    disarm();
    renderList();
  });
  function disarm() {
    const b = $('resetBtn');
    b.classList.remove('armed');
    b.textContent = 'Alle Werte löschen';
  }

  load();
  $('floorCount').value = state.floorCount;
  $('startFloor').value = state.startFloor;
  $('tolerance').value = state.tolerance;
  renderList();
</script>
</body>
</html>
